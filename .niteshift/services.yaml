services:
  # Postgres, Valkey, RabbitMQ, MinIO, the Django API, the workers and the migrator.
  - name: plane-backend
    command: docker compose -f docker-compose-local.yml up
    stopGracePeriod: 90s

  # web:3000, admin:3001, space:3002, live:3100 plus the shared package watchers.
  - name: plane-apps
    command: pnpm dev --env-mode=loose
    environment:
      # Lets the Vite dev servers answer requests carrying the preview Host header.
      # Passed through turbo's env filter by --env-mode=loose.
      - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
        value: .preview.niteshift.dev

  # Same routing as apps/proxy/Caddyfile.ce, pointed at the local dev servers, so
  # the apps, the API and MinIO share one origin the way they do in a deployment.
  - name: plane-proxy
    port: 4000
    stopGracePeriod: 15s
    command: |
      exec caddy run --adapter caddyfile --config - <<'CADDYFILE'
      {
          admin off
          auto_https off
          servers {
              max_header_size 25MB
          }
      }

      :{$PORT} {
          header {
              -X-Frame-Options
              Content-Security-Policy "frame-ancestors 'self' https://niteshift.dev https://*.niteshift.dev"
          }

          redir /spaces /spaces/ permanent
          reverse_proxy /spaces/* localhost:3002

          redir /god-mode /god-mode/ permanent
          reverse_proxy /god-mode/* localhost:3001

          reverse_proxy /live/* localhost:3100
          reverse_proxy /api/* localhost:8000
          reverse_proxy /auth/* localhost:8000
          reverse_proxy /static/* localhost:8000
          reverse_proxy /uploads/* localhost:9000
          reverse_proxy /* localhost:3000
      }
      CADDYFILE

envFiles:
  # Empty base URLs keep every app on the proxy origin, as the production images do.
  - path: apps/web/.env
    environment: &frontend_env
      - name: VITE_API_BASE_URL
        value: ""
      - name: VITE_WEB_BASE_URL
        value: ""
      - name: VITE_ADMIN_BASE_URL
        value: ""
      - name: VITE_ADMIN_BASE_PATH
        value: /god-mode
      - name: VITE_SPACE_BASE_URL
        value: ""
      - name: VITE_SPACE_BASE_PATH
        value: /spaces
      - name: VITE_LIVE_BASE_URL
        value: ""
      - name: VITE_LIVE_BASE_PATH
        value: /live
  - path: apps/admin/.env
    environment: *frontend_env
  - path: apps/space/.env
    environment: *frontend_env
  - path: apps/live/.env
    environment:
      - name: PORT
        value: 3100
      - name: LIVE_BASE_PATH
        value: /live
      - name: API_BASE_URL
        value: http://localhost:8000
      - name: REDIS_URL
        value: redis://localhost:6379/
      # Dev-only key; must match LIVE_SERVER_SECRET_KEY in apps/api/.env.
      - name: LIVE_SERVER_SECRET_KEY
        value: niteshift-plane-local-development-live-key
